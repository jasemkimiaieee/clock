<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="images/clock-icon.png" type="image/png">
</head>

<body>

    <div class="clock">
        <hour-container></hour-container>
        <minute-container></minute-container>
        <div class="hold"></div>
        <div class="h hand"></div>
        <div class="m hand"></div>
        <div class="s hand"></div>
        <div class="time">--:--:-- --</div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
